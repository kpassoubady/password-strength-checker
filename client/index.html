<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f8f9fa; }
    .checker-card { max-width: 480px; }
    .progress { height: 12px; }
    .progress-bar { transition: width 0.4s ease, background-color 0.4s ease; }
  </style>
</head>
<body class="d-flex justify-content-center pt-5 min-vh-100">
  <div class="checker-card w-100 px-3">
    <h1 class="text-center mb-4 h3">Password Strength Checker</h1>

    <div class="mb-3">
      <label for="passwordInput" class="form-label fw-semibold">Password</label>
      <div class="input-group">
        <input
          type="password"
          id="passwordInput"
          class="form-control"
          placeholder="Enter your password"
          autocomplete="new-password"
        />
        <button class="btn btn-outline-secondary" type="button" id="toggleBtn" aria-label="Toggle password visibility">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="mb-2">
      <div class="d-flex justify-content-between mb-1">
        <small class="text-muted">Strength</small>
        <small id="strengthLabel" class="fw-semibold text-secondary">—</small>
      </div>
      <div class="progress">
        <div
          id="strengthBar"
          class="progress-bar"
          role="progressbar"
          style="width: 0%"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </div>

    <ul id="feedbackList" class="list-unstyled mt-3 mb-0 small"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api/check-password';

    const input = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('toggleBtn');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');
    const feedbackList = document.getElementById('feedbackList');

    toggleBtn.addEventListener('click', function () {
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    const colorMap = {
      danger:  { bar: 'bg-danger',  text: 'text-danger'  },
      warning: { bar: 'bg-warning', text: 'text-warning' },
      info:    { bar: 'bg-info',    text: 'text-info'    },
      success: { bar: 'bg-success', text: 'text-success' },
    };

    const widthMap = { 0: 5, 1: 25, 2: 50, 3: 75, 4: 100 };

    function resetUI() {
      strengthBar.style.width = '0%';
      strengthBar.className = 'progress-bar';
      strengthBar.setAttribute('aria-valuenow', '0');
      strengthLabel.textContent = '—';
      strengthLabel.className = 'fw-semibold text-secondary';
      feedbackList.innerHTML = '';
    }

    function updateUI(data) {
      var score = data.score;
      var strength = data.strength;
      var suggestions = data.suggestions;
      var color = data.color;
      var classes = colorMap[color] || colorMap.danger;
      var width = widthMap[score];

      strengthBar.style.width = width + '%';
      strengthBar.className = 'progress-bar ' + classes.bar;
      strengthBar.setAttribute('aria-valuenow', width);

      strengthLabel.textContent = strength;
      strengthLabel.className = 'fw-semibold ' + classes.text;

      if (suggestions.length === 0) {
        feedbackList.innerHTML = '<li class="text-success">Password looks good!</li>';
      } else {
        feedbackList.innerHTML = suggestions
          .map(function (s) { return '<li class="' + classes.text + '">• ' + s + '</li>'; })
          .join('');
      }
    }

    var debounceTimer;

    input.addEventListener('input', function () {
      var value = input.value;
      if (!value) { resetUI(); return; }
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: value }),
        })
          .then(function (res) {
            if (!res.ok) throw new Error('API error');
            return res.json();
          })
          .then(updateUI)
          .catch(function () { /* ignore network errors during typing */ });
      }, 250);
    });
  </script>
</body>
</html>
